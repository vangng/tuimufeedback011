<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Phim</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(180deg,#000,#111,#000);
    color:white;
    text-align:center;
}

.header{
    padding:30px 15px 10px;
    font-size:26px;
    font-weight:700;
    letter-spacing:2px;
    background:linear-gradient(90deg,#ff0000,#ff5e00);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.top-note{
    font-size:16px;
    opacity:0.8;
    margin-bottom:15px;
}

.video-wrapper{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

.video-card{
    background:#141414;
    padding:20px;
    border-radius:25px;
    box-shadow:0 0 60px rgba(255,0,0,0.2);
}

iframe{
    width:100%;
    height:250px;
    border:none;
    border-radius:18px;
}

/* POPUP */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
    backdrop-filter:blur(6px);
}

.popup-content{
    background:linear-gradient(145deg,#1b1b1b,#111);
    padding:35px 25px;
    border-radius:25px;
    font-size:17px;
    max-width:350px;
    width:100%;
    position:relative;
    box-shadow:0 0 50px rgba(255,0,0,0.4);
}

.popup-content button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#ff0000,#ff5e00);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* RUNG */
@keyframes shake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
    100% { transform: translateX(0); }
}

.shake-btn {
    animation: shake 0.6s ease;
}

.pulse {
    animation: shake 0.6s ease infinite;
    animation-delay: 3s;
}

.footer{
    margin-top:60px;
    padding:30px;
    font-size:13px;
    opacity:0.4;
}

@media(min-width:768px){
    iframe{height:500px;}
}
</style>
</head>
<body>

<div id="popup" class="popup">
    <div class="popup-content" id="popupText"></div>
</div>

<div class="header">🎬 REVIEW PHIM TRỌN BỘ</div>

<div class="video-wrapper">

    <div class="top-note">
        🔥 Phim đang hot tuần này – Cập nhật mới nhất 2026
    </div>

    <div class="video-card">
        <iframe 
            src="https://www.youtube.com/embed/dFqZLXGgFE4"
            allowfullscreen>
        </iframe>
    </div>

</div>

<div class="footer">
    © 2026 REVIEW PHIM TRỌN | All Rights Reserved
</div>

<script>

let step = 1;
let maxStep = 3;

window.onload = function(){

    let savedStep = parseInt(localStorage.getItem("popupStep"));
    let time = parseInt(localStorage.getItem("popupTime"));

    if(!savedStep || !time || (Date.now() - time > 600000)){
        step = 1;
        localStorage.setItem("popupStep", 1);
        localStorage.setItem("popupTime", Date.now());
    }else{
        step = savedStep;
    }

    if(step <= maxStep){
        showPopup();
    }
};

function showPopup(){

    let text = "";

    if(step === 1){
        text = "🔥 Bước 1: Vui lòng xác nhận để tiếp tục.";
    }
    else if(step === 2){
        text = "🔥 Bước 2: Xác nhận thêm lần nữa để mở nội dung.";
    }
    else if(step === 3){
        text = "🔥 Bước 3: Hoàn tất xác nhận. Nhấn tiếp tục để vào xem phim.";
    }

    document.getElementById("popupText").innerHTML =
        text + "<br><br><button id='actionBtn'>Tiếp Tục</button>";

    document.getElementById("popup").style.display = "flex";

    document.getElementById("actionBtn").onclick = handleClick;

    // rung
    setTimeout(() => {
        let btn = document.getElementById("actionBtn");
        btn.classList.add("shake-btn");

        setTimeout(() => {
            btn.classList.remove("shake-btn");
            btn.classList.add("pulse");
        }, 600);

    }, 800);
}

function handleClick(){

    if(step < maxStep){
        window.open("https://s.shopee.vn/8KjFFnwNHZ", "_blank");

        step++;
        localStorage.setItem("popupStep", step);
        localStorage.setItem("popupTime", Date.now());

        showPopup(); // chuyển bước ngay lập tức
    }
    else{
        localStorage.setItem("popupStep", 4);
        document.getElementById("popup").style.display = "none";
    }
}

</script>

</body>
</html>
