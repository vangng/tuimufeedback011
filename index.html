<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Phim</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(180deg,#000,#111,#000);
    color:white;
    text-align:center;
}

.header{
    padding:30px 15px 10px;
    font-size:26px;
    font-weight:700;
    letter-spacing:2px;
    background:linear-gradient(90deg,#ff0000,#ff5e00);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.top-note{
    font-size:16px;
    opacity:0.8;
    margin-bottom:15px;
}

.video-wrapper{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

.video-card{
    background:#141414;
    padding:20px;
    border-radius:25px;
    box-shadow:0 0 60px rgba(255,0,0,0.2);
}

iframe{
    width:100%;
    height:250px;
    border:none;
    border-radius:18px;
}

/* POPUP */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
    backdrop-filter:blur(6px);
}

.popup-content{
    background:linear-gradient(145deg,#1b1b1b,#111);
    padding:35px 25px;
    border-radius:25px;
    font-size:17px;
    max-width:350px;
    width:100%;
    position:relative;
    box-shadow:0 0 50px rgba(255,0,0,0.4);
}

.popup-content button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#ff0000,#ff5e00);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* RUNG */
@keyframes shake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
    100% { transform: translateX(0); }
}

.shake-btn { animation: shake 0.6s ease; }

.pulse {
    animation: shake 0.6s ease infinite;
    animation-delay: 3s;
}

.footer{
    margin-top:60px;
    padding:30px;
    font-size:13px;
    opacity:0.4;
}

/* FACEBOOK BUTTON */
.fb-btn{
display:inline-block;
margin-top:15px;
padding:12px 28px;
border-radius:40px;
background:linear-gradient(135deg,#1877f2,#0a58ca);
color:white;
font-size:15px;
font-weight:600;
text-decoration:none;
box-shadow:0 0 20px rgba(24,119,242,0.6);
transition:0.3s;
}

.fb-btn:hover{
transform:scale(1.08);
box-shadow:0 0 30px rgba(24,119,242,0.9);
}

@media(min-width:768px){
iframe{height:500px;}
}
</style>
</head>
<body>

<div id="popup" class="popup">
<div class="popup-content" id="popupText"></div>
</div>

<div class="header"> FACEBOOK: REVIEW PHIM TRỌN BỘ</div>

<div class="video-wrapper">

<div class="top-note">
ngày đăng: 15/3/2026
</div>

<div class="video-card">
<iframe src="https://www.youtube.com/embed/dFqZLXGgFE4" allowfullscreen></iframe>
</div>

</div>

<div class="footer">
© 2026 REVIEW PHIM TRON BO Development | All Rights Reserved.
<br>
<a class="fb-btn" href="https://www.facebook.com/profile.php?id=61563087217509" target="_blank">Xem Facebook</a>
</div>

<script>

let step=1;

function isMobile(){
return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
}

window.onload=function(){
if(!isMobile()) return;
showPopup();
}

function showPopup(){

let text="";

if(step===1){
text=" Xác nhận để tiếp tục.";
}else{
text=" Xác nhận lần nữa để mở nội dung.";
}

document.getElementById("popupText").innerHTML=
text+"<br><br><button id='actionBtn'>Tiếp Tục</button>";

document.getElementById("popup").style.display="flex";

document.getElementById("actionBtn").onclick=handleClick;

setTimeout(()=>{
let btn=document.getElementById("actionBtn");
btn.classList.add("shake-btn");

setTimeout(()=>{
btn.classList.remove("shake-btn");
btn.classList.add("pulse");
},600);

},800);
}

function handleClick(){

window.open("https://s.shopee.vn/8KjFFnwNHZ","_blank");

if(step===1){
step=2;
showPopup();
}else{
document.getElementById("popup").style.display="none";
}

}

</script>

</body>
</html>
