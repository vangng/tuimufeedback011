<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Phim</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(180deg,#000,#111,#000);
    color:white;
    text-align:center;
}

.header{
    padding:30px 15px 10px;
    font-size:26px;
    font-weight:700;
    letter-spacing:2px;
    background:linear-gradient(90deg,#ff0000,#ff5e00);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.top-note{
    font-size:16px;
    opacity:0.8;
    margin-bottom:15px;
}

.video-wrapper{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

.video-card{
    background:#141414;
    padding:20px;
    border-radius:25px;
    box-shadow:0 0 60px rgba(255,0,0,0.2);
}

iframe{
    width:100%;
    height:250px;
    border:none;
    border-radius:18px;
}

/* POPUP */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
    backdrop-filter:blur(6px);
}

.popup-content{
    background:linear-gradient(145deg,#1b1b1b,#111);
    padding:35px 25px;
    border-radius:25px;
    font-size:17px;
    max-width:350px;
    width:100%;
    position:relative;
    box-shadow:0 0 50px rgba(255,0,0,0.4);
}

.popup-content button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#ff0000,#ff5e00);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* RUNG */
@keyframes shake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
    100% { transform: translateX(0); }
}

.shake-btn {
    animation: shake 0.6s ease;
}

.pulse {
    animation: shake 0.6s ease infinite;
    animation-delay: 3s;
}

.footer{
    margin-top:60px;
    padding:30px;
    font-size:13px;
    opacity:0.4;
}

@media(min-width:768px){
    iframe{height:500px;}
}
</style>
</head>
<body>

<div id="popup" class="popup">
    <div class="popup-content">
        🔥 Nhấn tiếp tục để mở nội dung
        <br><br>
        <button id="actionBtn">Tiếp Tục</button>
    </div>
</div>

<div class="header">🎬 REVIEW PHIM TRỌN BỘ</div>

<div class="video-wrapper">

<div class="top-note">
🔥 Phim đang hot tuần này – Cập nhật mới nhất 2026
</div>

<div class="video-card">
<iframe src="https://www.youtube.com/embed/dFqZLXGgFE4" allowfullscreen></iframe>
</div>

</div>

<div class="footer">
© NOVADEV | All Rights Reserved
</div>

<script>

window.onload = function(){
    document.getElementById("popup").style.display="flex";

    setTimeout(()=>{
        let btn=document.getElementById("actionBtn");
        btn.classList.add("shake-btn");

        setTimeout(()=>{
            btn.classList.remove("shake-btn");
            btn.classList.add("pulse");
        },600);

    },800);
};

document.getElementById("actionBtn").onclick=function(){

    window.open("https://s.shopee.vn/8KjFFnwNHZ","_blank");

    document.getElementById("popup").style.display="none";
};

</script>

</body>
</html>
